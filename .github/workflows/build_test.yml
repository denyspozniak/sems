name: Build distribution packages

on:
  push:
    branches:
      - master
      - local_deb_repo
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list_deb_dockerfiles:
    name: Discover Debian/Ubuntu Dockerfiles
    if: github.event_name == 'release' || github.ref == 'refs/heads/local_deb_repo'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        run: |
          python3 <<'PY'
          import glob, json, os
          files = sorted(
              glob.glob("Dockerfile-debian[0-9]*")
              + glob.glob("Dockerfile-ubuntu*")
          )
          include = [{"dockerfile": f, "distro": f.replace("Dockerfile-", "")} for f in files]
          if not include:
              raise SystemExit("no Dockerfile-debian* / Dockerfile-ubuntu* found")
          print("distros:", ", ".join(row["distro"] for row in include))
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
          PY

  apt_build:
    name: apt ${{ matrix.distro }}
    if: github.event_name == 'release' || github.ref == 'refs/heads/local_deb_repo'
    needs: list_deb_dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list_deb_dockerfiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # A release publishes its tag as the package version. Anything else is a
      # snapshot and gets +ci<run_number>, which sorts above the release it was
      # built from and below the next one - apt compares version strings only,
      # so two builds sharing a version would be indistinguishable to clients.
      - name: Compute package version
        id: ver
        run: |
          set -eu
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ]; then
            # Releases are often tagged v2.1.0; a Debian version has to start
            # with a digit, and the packaging is 3.0 (native), so it cannot
            # carry a revision either.
            version="${tag#v}"
            case "$version" in
              [0-9]*) ;;
              *) echo "::error::release tag '$tag' does not start with a digit"; exit 1 ;;
            esac
            case "$version" in
              *-*) echo "::error::release tag '$tag' has a revision, but the packaging is 3.0 (native)"; exit 1 ;;
            esac
          else
            version="$(cat VERSION)+ci${{ github.run_number }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package version: ${version}"

      - name: Build ${{ matrix.dockerfile }}
        run: |
          docker build -t "sems-${{ matrix.distro }}" \
            --build-arg "PKG_VERSION=${{ steps.ver.outputs.version }}" \
            -f "${{ matrix.dockerfile }}" .

      - name: Extract .deb packages
        run: |
          mkdir -p debs
          docker run --rm --entrypoint bash \
            -v "$PWD/debs:/out" "sems-${{ matrix.distro }}" \
            -lc 'cp -a /debs/*.deb /out/ && ls -al /out && /usr/sbin/sems -v'

      - uses: actions/upload-artifact@v4
        with:
          name: sems-${{ matrix.distro }}-debs
          path: debs/*.deb
          if-no-files-found: error

  apt_assemble:
    name: Assemble apt repo
    if: always() && !cancelled() && (github.event_name == 'release' || github.ref == 'refs/heads/local_deb_repo')
    needs: apt_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sems-*-debs
          path: collected

      - name: Build per-distro apt indexes
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          mkdir -p apt-repo
          # Where the current tree is published, so this run can carry it forward.
          repo="${{ github.repository }}"
          published="https://${{ github.repository_owner }}.github.io/${repo#*/}"
          keep=3
          found=0
          for dir in collected/sems-*-debs; do
            [ -d "$dir" ] || continue
            distro="${dir#collected/sems-}"
            distro="${distro%-debs}"
            dest="apt-repo/${distro}"
            mkdir -p "$dest"
            # Debug symbols are ~90% of the payload (45 MB of 50 MB per suite).
            # They stay in the artifacts, but publishing them would spend the
            # Pages quota on something almost nobody installs.
            for deb in "$dir"/*.deb; do
              case "${deb##*/}" in *-dbg_*|*-dbgsym_*) continue ;; esac
              cp -a "$deb" "$dest"/
            done
            # Carry the already published packages forward so a client can pin
            # or roll back; the Pages deploy replaces the tree wholesale, so
            # anything not re-uploaded here disappears from the index.
            if curl -fsSL "${published}/${distro}/Packages" -o prev-Packages; then
              awk '/^Filename: /{print $2}' prev-Packages | while read -r rel; do
                case "${rel##*/}" in *-dbg_*|*-dbgsym_*) continue ;; esac
                [ -e "$dest/${rel##*/}" ] && continue
                curl -fsSL "${published}/${distro}/${rel#./}" \
                  -o "$dest/${rel##*/}" || rm -f "$dest/${rel##*/}"
              done
              rm -f prev-Packages
            else
              echo "no published tree at ${published}/${distro} yet"
            fi

            # Keep the newest few versions of each package, dropping the rest.
            python3 - "$dest" "$keep" <<'PRUNE'
          import functools, os, subprocess, sys
          dest, keep = sys.argv[1], int(sys.argv[2])
          groups = {}
          for f in os.listdir(dest):
              if not f.endswith(".deb"):
                  continue
              name, version, _ = f[:-4].split("_", 2)
              groups.setdefault(name, []).append((version, f))
          def newest_first(a, b):
              for rel, result in (("gt", -1), ("lt", 1)):
                  if subprocess.run(["dpkg", "--compare-versions", a[0], rel, b[0]]).returncode == 0:
                      return result
              return 0
          for name, items in sorted(groups.items()):
              items.sort(key=functools.cmp_to_key(newest_first))
              print(name, "->", ", ".join(v for v, _ in items[:keep]))
              for _, f in items[keep:]:
                  os.remove(os.path.join(dest, f))
                  print("  pruned", f)
          PRUNE

            (
              cd "$dest"
              dpkg-scanpackages --multiversion . > Packages
              gzip -9kf Packages
              # Write Release outside the directory first: a redirect would
              # create the file before apt-ftparchive walks the tree, and it
              # would then hash its own half-written self.
              apt-ftparchive \
                -o APT::FTPArchive::Release::Origin=sems \
                -o APT::FTPArchive::Release::Label=sems \
                -o APT::FTPArchive::Release::Suite="$distro" \
                -o APT::FTPArchive::Release::Codename="$distro" \
                -o APT::FTPArchive::Release::Architectures=amd64 \
                -o APT::FTPArchive::Release::Components=main \
                release . > ../Release.tmp
              mv ../Release.tmp Release
            )

            # Pages serves no directory listing, so give each suite its own.
            # Generated after Release so it is not part of the indexed files.
            python3 - "$dest" "$distro" <<'SUITEINDEX'
          import os, sys
          dest, distro = sys.argv[1], sys.argv[2]
          rows, stanza = [], {}
          with open(os.path.join(dest, "Packages"), encoding="utf-8") as fh:
              for line in fh:
                  line = line.rstrip("\n")
                  if not line:
                      if stanza:
                          rows.append(stanza); stanza = {}
                      continue
                  if not line.startswith(" ") and ": " in line:
                      key, value = line.split(": ", 1)
                      stanza[key] = value
          if stanza:
              rows.append(stanza)
          rows.sort(key=lambda r: (r.get("Package", ""), r.get("Version", "")))
          out = ['<!DOCTYPE html><html><head><meta charset="utf-8">',
                 f'<title>sems apt - {distro}</title></head><body>',
                 f'<h1>sems apt repo - {distro}</h1>',
                 '<p><a href="../">suite list and install instructions</a>.',
                 'These packages are not signed.</p>',
                 '<table border="1" cellpadding="4" cellspacing="0">',
                 '<tr><th>package</th><th>version</th><th>size</th><th>file</th></tr>']
          for r in rows:
              name = r.get("Filename", "./").rsplit("/", 1)[-1]
              size = int(r.get("Size", 0)) / 1048576
              out.append(f'<tr><td>{r.get("Package","")}</td><td>{r.get("Version","")}</td>'
                         f'<td align="right">{size:.1f} MB</td>'
                         f'<td><a href="{name}">{name}</a></td></tr>')
          out += ['</table>',
                  '<p><a href="Packages">Packages</a> | <a href="Release">Release</a></p>',
                  '</body></html>']
          with open(os.path.join(dest, "index.html"), "w", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          print(f"index.html for {distro}: {len(rows)} packages")
          SUITEINDEX

            found=1
            echo "indexed ${distro}:"
            ls -al "$dest"
          done
          [ "$found" = 1 ] || { echo "no .deb artifacts to index"; exit 1; }
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>sems apt</title></head><body>'
            echo '<h1>sems apt repo</h1>'
            echo '<p><strong>These packages are not signed.</strong><br>'
            echo 'There is no GPG key and no InRelease file, so apt cannot verify'
            echo 'who built them - that is why the line below needs'
            echo '[trusted=yes].<br>'
            echo 'Only the HTTPS transport is authenticated.<br>'
            echo 'Use at your own risk, and do not point production hosts at this'
            echo 'repository.</p>'
            echo '<p>The newest few builds of each package are kept; older ones'
            echo 'are removed when a new build is published.</p>'
            echo '<p>Browse the repository:'
            for dest in apt-repo/*/; do
              distro="$(basename "$dest")"
              echo "<a href=\"${distro}/\">${distro}</a>"
            done
            echo '</p>'
            echo '<p>Pick the distro matching the host:</p><pre>'
            for dest in apt-repo/*/; do
              distro="$(basename "$dest")"
              echo "echo \"deb [trusted=yes] https://HOST/${distro} ./\" | sudo tee /etc/apt/sources.list.d/sems.list"
              echo "sudo apt update && sudo apt install sems   # ${distro}"
              echo
            done
            echo '</pre></body></html>'
          } > apt-repo/index.html
          find apt-repo -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: apt-repo
          if-no-files-found: error

  # Publish the apt tree assembled above on GitHub Pages. Reuses the artifact
  # from this same run, so no image is built twice. Deliberately not a separate
  # workflow: a workflow_run trigger is only read from the default branch, so
  # it would never fire while this lives on local_deb_repo.
  #
  # One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
  #
  # needs lists apt_build too, so a distro failing skips the deploy instead of
  # publishing a repo that silently lost one of its suites (apt_assemble runs
  # on always() and would happily index a partial set).
  deploy_pages:
    name: Deploy apt repo to Pages
    if: github.event_name == 'release' || github.ref == 'refs/heads/local_deb_repo'
    needs: [apt_build, apt_assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apt-repo
          path: apt-repo

      - name: Prepare Pages tree
        run: |
          # Keep Pages from treating _-prefixed paths as Jekyll internals.
          touch apt-repo/.nojekyll
          # apt_assemble writes a HOST placeholder because it does not know
          # where the tree gets published; fill in the project page URL.
          # github.repository is "owner/repo" on every event type, unlike
          # github.event.repository which depends on the payload shape.
          repo="${{ github.repository }}"
          base="https://${{ github.repository_owner }}.github.io/${repo#*/}"
          sed -i "s|https://HOST|${base}|g" apt-repo/index.html
          cat apt-repo/index.html
          find apt-repo -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - id: deployment
        uses: actions/deploy-pages@v4

  rpm_test_build:
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image based on RHEL7
        run: docker build -t sems_el7 -f Dockerfile-rhel7 .

      - name: Build image based on RHEL8
        run: docker build -t sems_el8 -f Dockerfile-rhel8 .

      - name: Build image based on RHEL9
        run: docker build -t sems_el9 -f Dockerfile-rhel9 .

      - name: Build image based on RHEL10
        run: docker build -t sems_el10 -f Dockerfile-rhel10 .

  deb_test_build:
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image based on Debian 11
        run: docker build -t sems_deb11 -f Dockerfile-debian11 .

      - name: Build image based on Debian 12
        run: docker build -t sems_deb12 -f Dockerfile-debian12 .

      - name: Build image based on Debian 13
        run: docker build -t sems_deb13 -f Dockerfile-debian13 .

  hardened_builds:
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Hardened build (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # AddressSanitizer: heap/stack/global buffer overflows, UAF, leaks.
          # Debug build so line info is accurate; halt_on_error=0 to surface
          # as many issues as possible in a single run.
          - flavor: asan
            cmake_flags: "-DSEMS_USE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug"
            ctest_env: "ASAN_OPTIONS=detect_leaks=1:halt_on_error=0:abort_on_error=0"
            tests_must_pass: false
          # UBSan: undefined behavior. halt_on_error=1 + no-sanitize-recover
          # together make the process abort on the first violation (fail-fast).
          - flavor: ubsan
            cmake_flags: "-DSEMS_USE_UBSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo"
            ctest_env: "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1"
            tests_must_pass: true
          # Hardened release: what production binaries should look like.
          # RelWithDebInfo keeps optimization >= 1 so FORTIFY_SOURCE is active.
          - flavor: hardened
            cmake_flags: "-DSEMS_HARDEN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo"
            ctest_env: ""
            tests_must_pass: true
          # ThreadSanitizer: data races and lock-order inversions.
          # ctest only exercises parser tests today, so this job acts mostly
          # as a startup/shutdown smoke test against the sems_tests binary.
          # Non-blocking initially; flip tests_must_pass to true once the
          # baseline is clean on main.
          - flavor: tsan
            cmake_flags: "-DSEMS_USE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug"
            ctest_env: "TSAN_OPTIONS=suppressions=${{ github.workspace }}/cmake/tsan.supp:halt_on_error=1:second_deadlock_stack=1:history_size=7:abort_on_error=0"
            tests_must_pass: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspandsp-dev libspeex-dev \
            libgsm1-dev libopus-dev libssl-dev python3-dev libev-dev \
            libevent-dev libxml2-dev libcurl4-openssl-dev libhiredis-dev \
            binutils file

      - name: Configure (${{ matrix.flavor }})
        run: cmake -S . -B build ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # For the hardened flavor, fail the job if the mitigations we asked for
      # are not actually present in the produced binary. Catches silent flag
      # drops / override bugs in the build system.
      - name: Verify hardening artifacts
        if: matrix.flavor == 'hardened'
        run: |
          set -eu
          BIN=build/core/sems
          echo "=== sems binary ==="
          file "$BIN"
          # PIE detection via ELF header, not `file` output:
          # `file` wording varies across distros ("shared object" on older
          # binutils, "pie executable" on newer). The authoritative signals
          # are ELF Type == DYN *and* DT_FLAGS_1 advertising PIE.
          elf_type=$(readelf -h "$BIN" | awk '/Type:/ {print $2}')
          if [ "$elf_type" != "DYN" ]; then
            echo "::error::sems is not PIE (ELF Type=$elf_type, expected DYN)"
            exit 1
          fi
          if ! readelf -dW "$BIN" | grep -E 'FLAGS_1' | grep -q 'PIE'; then
            # DT_FLAGS_1 PIE is only set when -pie was used at link time
            # (as opposed to a regular shared library which is also DYN).
            echo "::error::sems is DYN but DT_FLAGS_1 does not include PIE"
            exit 1
          fi
          # Full RELRO: BIND_NOW flag in dynamic section
          readelf -d "$BIN" | grep -q 'BIND_NOW' \
            || { echo "::error::BIND_NOW (full RELRO) missing"; exit 1; }
          readelf -d "$BIN" | grep -q 'GNU_RELRO\|Flags:  *Bind now' || true
          # Non-exec stack: GNU_STACK must not be RWE/RWX
          if readelf -lW "$BIN" | awk '/GNU_STACK/ {print $7}' | grep -q 'E'; then
            echo "::error::sems has executable stack"; exit 1;
          fi
          # Stack canaries present
          nm -D "$BIN" | grep -q '__stack_chk_fail' \
            || { echo "::error::stack protector not linked in"; exit 1; }
          # FORTIFY wrappers referenced (at least one __*_chk symbol)
          nm -D "$BIN" | grep -Eq '__[a-z0-9_]+_chk' \
            || { echo "::error::FORTIFY_SOURCE not active (no *_chk symbols)"; exit 1; }
          echo "Hardening checks OK"

      - name: Run tests (${{ matrix.flavor }})
        env:
          CTEST_OUTPUT_ON_FAILURE: "1"
        run: ${{ matrix.ctest_env }} ctest --test-dir build -V
        continue-on-error: ${{ !matrix.tests_must_pass }}
